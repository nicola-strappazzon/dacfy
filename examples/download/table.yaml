---
database:
  name: download
  delete: true
table:
  name: download
  description: |
    Stores generated download events.
    The query creates sample data for this example.
  delete: true
  engine: MergeTree
  partition_by:
    - toYYYYMM(when)
  order_by: [userid, when]
  columns:
    - { name: when,   type: DateTime }
    - { name: userid, type: UInt32 }
    - { name: bytes,  type: Float32 }
  query: |
    INSERT INTO download
    SELECT
      now() + number * 60 as when,
      25,
      rand() % 100000000
    FROM system.numbers
    LIMIT 10000000
