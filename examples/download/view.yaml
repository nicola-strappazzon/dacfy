---
description: |
  Creates a daily aggregation for generated download events.
  It demonstrates a materialized view with an implicit target table.
database:
  name: download
view:
  name: download_daily_mv
  description: |
    Aggregates downloads by user and day.
    It stores counts and transferred bytes.
  delete: true
  engine: SummingMergeTree
  partition_by:
    - toYYYYMM(day)
  order_by: [userid, day]
  query: |
    SELECT
      toStartOfDay(when) AS day,
      userid,
      count() as downloads,
      sum(bytes) AS bytes
    FROM download.download
    GROUP BY userid, day
